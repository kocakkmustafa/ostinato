name: ostinato
description: "Ostinato — music practice. Kabuk YALNIZ kablolama: her hüküm packages/ostinato_posture'da ve testte."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+7

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  supabase_flutter: 2.17.2
  intl: 0.20.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared Motion account uses the same immutable revision as core and camera.
  motion_account:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_account
      ref: 0d29d1b019033f00828be741aa3e23e3923841be
  ostinato_posture:
    path: packages/ostinato_posture
  # OST-P0-002 (2026-08-19): şimdiye kadar `ostinato_audio` yalnız KENDİ
  # test'lerinde tüketiliyordu (roadmap §1: "app session'a production bağlı
  # değil") — bu satır o boşluğu kapatır, kabuk (`lib/app/audio/`) artık
  # pitch/onset/chord primitiflerine erişebilir.
  ostinato_audio:
    path: packages/ostinato_audio
  # Alt paketler ve uygulama aynı TAM-40-SHA'yı kullanır. Pub, aynı Git
  # paketinin farklı ref dizelerini ayrı kaynak sayar (M-F-265). Bu ref,
  # Motion hesap + üyelik çekirdeğinin onaylanan sürümüdür; pin testleri
  # bütün descriptor ve kilitlerin aynı commit'e çözülmesini denetler.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: 0d29d1b019033f00828be741aa3e23e3923841be
  # Flutter bundle bytes are checked by the same pinned Core content contract.
  # Production manifests and media playback remain separate acceptance gates.
  motion_content:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_content
      ref: 0d29d1b019033f00828be741aa3e23e3923841be
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      ref: 0d29d1b019033f00828be741aa3e23e3923841be
      path: packages/motion_camera
  # Core R1+ lesson lock (isLessonUnlocked); same pin as motion_account.
  motion_entitlements:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_entitlements
      ref: 0d29d1b019033f00828be741aa3e23e3923841be

  permission_handler: ^12.0.3

  # QA-only silent lesson player adapter. Shipping lesson media remains empty.
  video_player: 2.11.1

  # YALNIZ poz modelini uygulama-özel bir dosyaya yazmak için (plugin bundle
  # değil YOL ister) — depolama BİÇİMİ yok, kablolama katmanında kalıyor.
  path_provider: ^2.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  http: 1.6.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# Exact native permit creation/release contract; keep all four layers together.
# Shipping lesson media stays empty and practice acquisition remains closed.
dependency_overrides:
  video_player:
    path: third_party/video_player_permit/video_player-2.11.1
  video_player_android:
    path: third_party/video_player_permit/video_player_android-2.12.2
  video_player_avfoundation:
    path: third_party/video_player_permit/video_player_avfoundation-2.12.0
  video_player_platform_interface:
    path: third_party/video_player_permit/video_player_platform_interface-6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/l10n/
    # Sözleşme ve kütüphane ÜRETİLEN varlıklardır (tools/gen_posture_contract.py
    # ve validate_library kapıları). Kabuk sayı taşımaz, okur.
    - assets/config/posture-contract.json
    - assets/config/audio-contract.json
    - assets/config/inference-manifest.v1.json
    - assets/content/library.json
    - assets/content/guitar_journey.v1.json
    - assets/content/piano_beginner.v1.json
    - assets/content/ukulele_beginner.v1.json
    - assets/content/bass_beginner.v1.json
    - assets/content/vocal_beginner.v1.json
    - assets/motion_content/manifest.json
    # Code-pinned source membership for closed QA; the shipping media slot is empty.
    - assets/motion_content/ostinato_source_pins_v2k.json
    # Exact v2l source identities only; these assets contain no playable media.
    - assets/motion_content/ostinato.source-slice.v1.json
    - assets/motion_content/ostinato.source-projection.v1.json
    - assets/config/guitar-observation.v2.json
    # OFL lisans metinleri — paketlenmiş font DOSYALARIYLA BİRLİKTE dağıtılmak
    # OFL §2'nin şartı (D1, H-34/H-40 bağı: google_fonts kalktı, yazı tipleri
    # artık gömülü — lisans de gömülü olmalı).
    - assets/fonts/OFL-HankenGrotesk.txt
    - assets/fonts/OFL-IBMPlexMono.txt
    - config/observation-cue-templates.golden.json
    - assets/models/pose_landmarker_full.v1.task

  # D1 (2026-08-16, O-149): google_fonts + iki transitif vasıtası (http,
  # http_parser) kalktı; yazı yüzleri artık PAKETLİ. Ağırlıklar ÖLÇÜLEN
  # kullanımla birebir (grep -rohn 'FontWeight\.w[0-9]+' lib/ +
  # tools/evidence/flutter_test_config.dart'ın eski ön-ısınma listesi):
  # Hanken Grotesk {400, 500, 600} · IBM Plex Mono {500 tek}.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
